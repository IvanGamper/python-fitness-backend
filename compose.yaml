name: python-fitness-demo

services:
  products:
    build:
      context: .
      target: products
    environment:
      RESEND_API_KEY: local-demo
    ports:
      - "127.0.0.1:8100:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 10

  orders:
    build:
      context: .
      target: orders
    depends_on:
      products:
        condition: service_healthy
    environment:
      PRODUCT_API_URL: http://products:8000/api/v1/products
      ORDERS_DB_PATH: /data/orders_demo.sqlite3
    ports:
      - "127.0.0.1:8101:8000"
    volumes:
      - orders-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live', timeout=2).close()"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  orders-data:
